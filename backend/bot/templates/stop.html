{% extends "layout.html" %}

{% block body %}

    <h2>Start Grabbing</h2>

    {% if message %}
        <div>{{ message }}</div>
    {% endif %}

    <form action="{% url 'stopprocess' %}" method="post">
        {% csrf_token %}
        <div class="form-group">
            <input autofocus class="form-control" type="hidden" name="username" placeholder="Username">
        </div>
        <div class="form-group">
            <input class="form-control" type="hidden" name="password" placeholder="Password">
        </div>
        <input class="btn btn-primary" type="submit" value="STOP">
    </form>

    {% include "footer.html" %}
{% endblock %}
